services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ymcp
      POSTGRES_USER: ymcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ymcp}
    ports: ["5432:5432"]
    volumes: ["ymcp-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ymcp -d ymcp"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    image: temporalio/auto-setup:latest
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ymcp
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-ymcp}
      POSTGRES_SEEDS: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["7233:7233"]
    healthcheck:
      test: ["CMD-SHELL", "tctl --address temporal:7233 namespace list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  temporal-ui:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      temporal:
        condition: service_started
    ports: ["8088:8080"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333", "6334:6334"]
    volumes: ["ymcp-qdrant:/qdrant/storage"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ymcp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ymcp-minio-local}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["ymcp-minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://ymcp:${POSTGRES_PASSWORD:-ymcp}@postgres:5432/ymcp
      REDIS_HOST: redis
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-ymcp-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: ["./deploy/litellm.config.yaml:/app/config.yaml:ro"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["4000:4000"]

volumes:
  ymcp-postgres:
  ymcp-qdrant:
  ymcp-minio:
